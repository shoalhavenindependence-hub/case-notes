name: Android app

on:
  push:
    branches: [play-store]
    paths: ['android-app/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build the app screens from the web app
        run: python3 scripts/build-www.py

      - name: Sync Android project
        run: npx cap sync android

      - name: Build test APK (install straight onto a phone)
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: shift-case-notes-test-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Play Store bundle
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android-app/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: shift-case-notes-play-store-bundle
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab

name: iPhone app

on:
  push:
    branches: [play-store, 'claude/**']
    paths: ['android-app/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: android-app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build the app screens from the web app
        run: python3 scripts/build-www.py

      - name: Sync iPhone project
        run: npx cap sync ios

      # Always: check the app builds, without Apple signing.
      - name: Test build for the iPhone simulator
        working-directory: android-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" = 0

      # With the App Store Connect key in the repo secrets: sign and send to TestFlight.
      - name: Build and upload to TestFlight
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android-app/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tidy pasted values: stray spaces/new lines, and a key pasted as one line.
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          BODY=$(printf '%s' "$KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d '[:space:]')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout && echo "Apple key looks valid"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO archive | tail -40
          test "${PIPESTATUS[0]}" = 0
          # Apple signs the app for the App Store at export (cloud signing), so no iPhone needs registering.
          cp ../ExportOptions/app-store.plist "$RUNNER_TEMP/export.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          test "${PIPESTATUS[0]}" = 0
